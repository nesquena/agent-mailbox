name: Bug report
description: Something in the CLI, an adapter, a hook or the docs doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: report it privately (see SECURITY.md). Leave out keys, tokens and
        private store addresses.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `agent-mailbox --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and shell
      description: For example "macOS 15, /bin/sh" or "Ubuntu 24.04, dash".
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Adapter
      options: [git, dir, not sure]
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The commands, in order, and the store's layout if it matters.
      render: shell
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: Paste the output, including the exit code.
    validations:
      required: true
