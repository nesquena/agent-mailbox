name: test

on:
  # every pull request and push to main runs the workflow, so the gate job below always reports; the changes job
  # decides whether the tests run. A pull request moved to another base branch doesn't run again by itself (an edited
  # trigger would, but also on every title or body edit, cancelling a run in progress and leaving a failed gate). After
  # retargeting, push a commit, or close and reopen the pull request: a re-run checks the old base again
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # the release workflow runs these tests on the commit it releases (the full matrix, macOS included)
  workflow_call:

permissions:
  contents: read

# a newer push to a pull request's branch, or a newer manual run on the same branch, cancels the run it supersedes;
# each push to main gets a group of its own, so none is cancelled, pending or running
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  # a change to prose alone (Markdown files, docs/, LICENSE) runs no tests: the suite reads none of it. A change that
  # also touches anything else runs them, and so does a manual run, a new branch, or a diff git can't compute. Renames
  # count as both paths (--no-renames), so moving code to a prose path still runs them
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      os: ${{ steps.diff.outputs.os }}
      whole: ${{ steps.diff.outputs.whole }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'macos') }}
        run: |
          case "$EVENT" in
            (pull_request) base=$PR_BASE head=$PR_HEAD; base=$(git merge-base "$base" "$head" 2>/dev/null) || base="" ;;
            (push) base=$PUSH_BEFORE head=$PUSH_AFTER ;;
            (*) base="" head="" ;;
          esac
          code=true
          case "$base" in (''|*[!0]*) ;; (*) base="" ;; esac
          if [ -n "$base" ] && files=$(git diff --no-renames --name-only "$base" "$head" --) && [ -n "$files" ]; then
            code=false
            while IFS= read -r f; do
              case "$f" in (*.md|docs/*|LICENSE) ;; (*) code=true; break ;; esac
            done <<EOF
          $files
          EOF
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "changes beyond prose: $code"
          # a pull request runs Linux only, unless it has the `macos` label (read when the pull request is opened or
          # reopened, or a push starts the run: a re-run keeps the labels it had then); a push to main, a manual run and
          # the release workflow run Linux and macOS
          if [ "$EVENT" = pull_request ] && [ "$MACOS_LABEL" != true ]; then os='["ubuntu-latest"]'
          else os='["ubuntu-latest", "macos-latest"]'; fi
          echo "os=$os" >> "$GITHUB_OUTPUT"
          echo "operating systems: $os"
          # and a manual run (the release workflow's call is one too) also runs the whole suite once per OS, as one shard
          if [ "$EVENT" = workflow_dispatch ]; then
            whole='[{"os": "ubuntu-latest", "shell": "dash", "shard": "1/1"}, {"os": "macos-latest", "shell": "sh", "shard": "1/1"}]'
          else whole='[]'; fi
          echo "whole=$whole" >> "$GITHUB_OUTPUT"
          echo "unsharded runs: $whole"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # one job per OS, shell and shard, so they run side by side: dash and bash on Linux (where sh is dash), and sh
      # (bash in POSIX mode) and bash on macOS, where the changes job includes it. Each shard runs a quarter of the
      # suite's sections (test/run.sh --shard), and a manual run adds the whole suite as shard 1/1. A push to main runs
      # the sections in an order of its own (--order with the run's number, printed first)
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
        shell: [sh, dash, bash]
        shard: [1/4, 2/4, 3/4, 4/4]
        exclude:
          - {os: ubuntu-latest, shell: sh}
          - {os: macos-latest, shell: dash}
        include: ${{ fromJSON(needs.changes.outputs.whole) }}
    runs-on: ${{ matrix.os }}
    # (above the run's own limit, 40 minutes, so the run ends first and says why, rather than GitHub cancelling it)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: git identity for the tests' own setup commits
        run: |
          git config --global user.name test
          git config --global user.email test@example.invalid
          git config --global init.defaultBranch main
      # (every shard needs dash, bats and ssh-keygen, and zsh for the parse check and the safeguards' zsh run; only the
      # first shard of each run does the parse and shard checks)
      - name: Install dash and zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get -o Acquire::Retries=3 install -y -q dash zsh
      # bats-core runs test/*.bats; pinned to a commit, as the actions are
      - name: Install bats-core 1.14.0
        run: |
          git init -q "$RUNNER_TEMP/bats-core"
          git -C "$RUNNER_TEMP/bats-core" fetch -q --depth 1 https://github.com/bats-core/bats-core.git eb7f42f8d608ac693d7a4b67474f6714ea68cfc5
          git -C "$RUNNER_TEMP/bats-core" checkout -q FETCH_HEAD
          "$RUNNER_TEMP/bats-core/install.sh" "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - name: Parse under every available shell
        if: matrix.shard == '1/4'
        run: |
          for s in sh dash bash zsh; do
            command -v "$s" >/dev/null || { echo "$s not installed"; exit 1; }
            for f in bin/agent-mailbox adapters/git.sh adapters/dir.sh hooks/claude-watch-guard.sh hooks/claude-rewake.sh install.sh test/run.sh test/bench.sh test/shards-cover.sh; do
              "$s" -n "$f" || { echo "$s can't parse $f"; exit 1; }
            done
            echo "$s ok"
          done
      - name: The shards run every section once
        if: matrix.shard == '1/4'
        run: TEST_SHELL=${{ matrix.shell }} ${{ matrix.shell }} test/shards-cover.sh 2 3 4 5
      - name: Test suite (${{ matrix.shell }}, shard ${{ matrix.shard }})
        run: >-
          REQUIRE_SSH=1 REQUIRE_BATS=1 TEST_SHELL=${{ matrix.shell }} ${{ matrix.shell }} test/run.sh --shard ${{ matrix.shard }}
          ${{ github.event_name == 'push' && format('--order {0}', github.run_number) || '' }}

  # the one check a branch rule requires: it passes at once for a prose-only change, and otherwise only when every test
  # job passed
  gate:
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TESTS: ${{ needs.test.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "the changes job didn't succeed ($CHANGES)"; exit 1; }
          # (only an explicit false passes without the tests: anything else waits for them)
          if [ "$CODE" = false ]; then echo "prose only: no tests to wait for"; exit 0; fi
          [ "$TESTS" = success ] || { echo "the tests didn't all pass ($TESTS)"; exit 1; }
          echo "every test job passed"
