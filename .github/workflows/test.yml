name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: git identity for the tests' own setup commits
        run: |
          git config --global user.name test
          git config --global user.email test@example.invalid
          git config --global init.defaultBranch main
      - name: Parse under every available shell
        run: |
          for s in sh dash bash zsh; do
            command -v "$s" >/dev/null || { echo "$s not installed, skipped"; continue; }
            for f in bin/agent-mailbox adapters/git.sh adapters/dir.sh hooks/claude-watch-guard.sh install.sh test/run.sh test/bench.sh; do
              "$s" -n "$f" || { echo "$s can't parse $f"; exit 1; }
            done
            echo "$s ok"
          done
      - name: Install dash (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -q dash
      - name: Test suite (default sh)
        run: REQUIRE_SSH=1 sh test/run.sh
      - name: Test suite (dash)
        if: runner.os == 'Linux'
        run: REQUIRE_SSH=1 TEST_SHELL=dash dash test/run.sh
      - name: Test suite (bash)
        run: REQUIRE_SSH=1 TEST_SHELL=bash bash test/run.sh
