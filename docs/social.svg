<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <!-- The link-preview image (docs/social.png is rendered from this): the site's envelope mark over a git history,
       since the mail travels as commits. Render: rsvg-convert -w 1200 -h 1200 docs/social.svg -o docs/social.png -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>

  <!-- the envelope: the site mark, filled -->
  <g transform="translate(600 440)">
    <rect x="-360" y="-240" width="720" height="480" rx="52" fill="#1e1b4b" opacity="0.35" transform="translate(0 24)"/>
    <rect x="-360" y="-240" width="720" height="480" rx="52" fill="#ffffff"/>
    <path d="M-312 -198 L0 40 L312 -198" fill="none" stroke="#4338ca" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-312 198 L-96 -18 M312 198 L96 -18" fill="none" stroke="#e0e7ff" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- a git history: the main line, and a branch that leaves, takes two commits, and merges back -->
  <g fill="none" stroke="#a5b4fc" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 990 H1050"/>
    <path d="M390 990 C 455 990, 455 850, 520 850 H680 C 745 850, 745 990, 810 990"/>
  </g>
  <g fill="#ffffff">
    <circle cx="230" cy="990" r="34"/>
    <circle cx="390" cy="990" r="34"/>
    <circle cx="520" cy="850" r="34"/>
    <circle cx="680" cy="850" r="34"/>
    <circle cx="810" cy="990" r="34"/>
    <circle cx="970" cy="990" r="34"/>
  </g>
</svg>
